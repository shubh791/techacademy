<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | TechAcademy Course Advisory & Admissions</title>
  <meta name="description" content="Have a question about our courses, online training, offers, or job placements? Send us your enquiry and our education advisory team will get back to you promptly.">
  
  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          },
          colors: {
            brand: {
              purple: '#1e1b4b',
              navy: '#0b142c',
              dark: '#040814',
              surface: '#0d1a38',
              accent: '#f59e0b',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex flex-col antialiased selection:bg-amber-400 selection:text-slate-950 font-sans">

  <!-- Shared Responsive Header with Courses Mega Menu -->
  <header id="site-header" class="w-full z-50 sticky top-0"></header>

  <!-- Main Unified Contact Us Content -->
  <main class="flex-grow py-6 sm:py-8 lg:py-10 flex items-center">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
      
      <!-- =========================================================================
           UNIFIED CONTACT SPLIT CONTAINER: [ IMAGE (~43%) | FORM (~57%) ]
           ========================================================================= -->
      <div class="bg-white rounded-2xl sm:rounded-3xl border border-slate-200/90 shadow-sm overflow-hidden grid grid-cols-1 lg:grid-cols-12 items-stretch">
        
        <!-- LEFT ~43% (lg:col-span-5): Synchronized Full-Height Image Column (Desktop/Tablet Only) -->
        <div class="hidden lg:block lg:col-span-5 relative w-full h-full min-h-0 bg-slate-100 overflow-hidden order-1">
          <img 
            src="./images/contact-advisor-consultation.jpg" 
            alt="TechAcademy Education Advisor Consultation" 
            class="w-full h-full object-cover object-top block"
            width="600"
            height="800"
          />
        </div>

        <!-- RIGHT ~57% (lg:col-span-7): Compact, Polished Contact Form Column with Subtle Mobile Background -->
        <div class="lg:col-span-7 p-5 sm:p-8 lg:p-10 xl:p-11 flex flex-col justify-center order-1 lg:order-2 bg-white relative overflow-hidden">
          
          <!-- Subtle Contact Background Image on Mobile Only (8-12% opacity) -->
          <div class="block lg:hidden absolute inset-0 z-0 pointer-events-none overflow-hidden" aria-hidden="true">
            <img 
              src="./images/contact-advisor-consultation.jpg" 
              alt="" 
              class="w-full h-full object-cover object-center opacity-[0.10] select-none"
              loading="lazy"
            />
            <div class="absolute inset-0 bg-gradient-to-b from-white/80 via-white/92 to-white/98"></div>
          </div>

          <!-- Form & Content Wrapper (Crisp z-10) -->
          <div class="relative z-10">
            <!-- Compact Heading Area -->
            <div class="mb-5 sm:mb-6">
              <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-purple-50 border border-purple-200/60 text-[11px] font-bold uppercase tracking-wider text-[#45318A] mb-2">
                GET IN TOUCH
              </div>
              <h1 class="text-2xl sm:text-3xl lg:text-[32px] font-extrabold tracking-tight text-slate-900 leading-tight">
                Contact Us
              </h1>
              <div class="w-10 h-1 bg-amber-400 mt-1.5 mb-2.5 rounded-full"></div>
              <p class="text-xs sm:text-sm text-slate-600 font-normal leading-relaxed max-w-xl">
                Have a question about our courses or training options? Send us your enquiry and our team will get back to you.
              </p>
            </div>

            <!-- Contact Form with Compact Rhythm -->
            <form id="contact-page-form" class="space-y-4 sm:space-y-4.5">
              
              <!-- Row 1: Full Name & Email Address -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <!-- Full Name -->
                <div>
                  <label for="contact-name" class="block text-xs font-semibold text-slate-700 mb-1">
                    Full Name <span class="text-amber-500">*</span>
                  </label>
                  <input 
                    type="text" 
                    id="contact-name"
                    name="name" 
                    required 
                    placeholder="Enter your full name" 
                    class="w-full h-12 px-3.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#45318A] focus:border-transparent transition-all"
                  >
                </div>

                <!-- Email Address -->
                <div>
                  <label for="contact-email" class="block text-xs font-semibold text-slate-700 mb-1">
                    Email Address <span class="text-amber-500">*</span>
                  </label>
                  <input 
                    type="email" 
                    id="contact-email"
                    name="email" 
                    required 
                    placeholder="name@company.com" 
                    class="w-full h-12 px-3.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#45318A] focus:border-transparent transition-all"
                  >
                </div>

              </div>

              <!-- Row 2: Contact Number (with Working Country Selector) & Enquiry Type -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                <!-- Contact Number with Country Selector -->
                <div>
                  <label for="contact-phone" class="block text-xs font-semibold text-slate-700 mb-1">
                    Contact Number <span class="text-amber-500">*</span>
                  </label>
                  <div class="relative flex items-center border border-slate-300 rounded-lg bg-white focus-within:ring-2 focus-within:ring-[#45318A] focus-within:border-transparent transition-all h-12">
                    <div data-country-selector data-default="in" data-input-name="country_code" class="h-full shrink-0"></div>
                    <div class="w-px h-5 bg-slate-200 shrink-0"></div>
                    <input 
                      type="tel" 
                      id="contact-phone" 
                      name="phone" 
                      required 
                      placeholder="Enter contact number" 
                      class="w-full h-full px-3 bg-transparent text-sm text-slate-900 placeholder-slate-400 focus:outline-none"
                    >
                  </div>
                </div>

                <!-- Enquiry Type (Only real TechAcademy areas) -->
                <div>
                  <label for="contact-enquiry-type" class="block text-xs font-semibold text-slate-700 mb-1">
                    Enquiry Type <span class="text-amber-500">*</span>
                  </label>
                  <div class="relative">
                    <select 
                      id="contact-enquiry-type" 
                      name="enquiry_type" 
                      required
                      class="w-full h-12 pl-3.5 pr-9 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#45318A] focus:border-transparent transition-all cursor-pointer appearance-none"
                    >
                      <option value="Course Enquiry" selected>Course Enquiry</option>
                      <option value="Online Training">Online Training</option>
                      <option value="Offers">Offers</option>
                      <option value="Job Placements">Job Placements</option>
                      <option value="General Enquiry">General Enquiry</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-slate-400">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                      </svg>
                    </div>
                  </div>
                </div>

              </div>

              <!-- Row 3: Message Textarea -->
              <div>
                <label for="contact-message" class="block text-xs font-semibold text-slate-700 mb-1">
                  Message <span class="text-amber-500">*</span>
                </label>
                <textarea 
                  id="contact-message"
                  name="message" 
                  rows="3" 
                  required 
                  placeholder="Tell us about your learning goals or questions..." 
                  class="w-full h-[110px] sm:h-[120px] p-3.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#45318A] focus:border-transparent transition-all resize-none"
                ></textarea>
              </div>

              <!-- Submission Feedback Notification -->
              <div id="contact-success-notification" class="hidden p-3.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs sm:text-sm font-medium">
                ✓ Thank you! Your enquiry has been received. A TechAcademy advisor will respond shortly.
              </div>

              <!-- Submit Button -->
              <div class="pt-1">
                <button 
                  type="submit" 
                  class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-3.5 rounded-lg bg-[#45318A] hover:bg-[#341F69] text-white font-bold text-sm shadow-sm hover:shadow-md transition-all cursor-pointer"
                >
                  <span>Submit Enquiry</span>
                  <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                  </svg>
                </button>
              </div>

            </form>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- Shared Responsive Footer -->
  <div id="site-footer"></div>

  <!-- Core Scripts -->
  <script src="./js/data/courses.js"></script>
  <script src="./js/components/country-selector.js"></script>
  <script src="./js/components/header.js"></script>
  <script src="./js/components/footer.js"></script>

  <!-- Initializer -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Render Shared Header
      if (typeof renderHeader === "function") {
        renderHeader("site-header");
      }

      // 2. Render Shared Footer
      if (typeof renderFooter === "function") {
        renderFooter("site-footer");
      }

      // 3. Initialize Country Selector Component
      if (typeof initCountrySelectors === "function") {
        initCountrySelectors();
      }

      // 4. Form Submission Handling
      const contactForm = document.getElementById("contact-page-form");
      const successNotif = document.getElementById("contact-success-notification");

      if (contactForm) {
        contactForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const submitBtn = contactForm.querySelector("button[type='submit']");
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = "Enquiry Submitted ✓";
            submitBtn.classList.remove("bg-[#45318A]", "hover:bg-[#341F69]");
            submitBtn.classList.add("bg-emerald-600");
          }
          if (successNotif) {
            successNotif.classList.remove("hidden");
          }
        });
      }
    });
  </script>
</body>
</html>
